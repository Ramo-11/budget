  <script>(function(){try{var p=localStorage.getItem('sahabBudget_theme')||'system';var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var a=JSON.parse(localStorage.getItem('sahabBudget_hideAmounts')||'false');if(a)document.documentElement.classList.add('hide-amounts');}catch(e){}})();</script>
