<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="See where your money goes: trends, cashflow, categories, merchants, subscriptions, month comparisons and a printable monthly review." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Budget" />
  <title>Insights | Sahab Budget</title>
  <script>(function(){try{var p=localStorage.getItem('sahabBudget_theme')||'system';var d=p==='dark'||(p==='system'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');var a=JSON.parse(localStorage.getItem('sahabBudget_hideAmounts')||'false');if(a)document.documentElement.classList.add('hide-amounts');}catch(e){}})();</script>
  <link rel="icon" href="images/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/tx-sheet.css" />
  <link rel="stylesheet" href="css/import.css" />
  <link rel="stylesheet" href="css/getting-started.css" />
  <link rel="stylesheet" href="css/analytics.css" />
</head>
<body data-page="insights">
  <div id="appShell"></div>
  <main id="main" class="page" tabindex="-1">
    <header class="page-header ins-header no-print">
      <div>
        <h1>Insights</h1>
        <p class="muted" id="insSubtitle">See where your money goes and how it changes.</p>
      </div>
      <div class="ins-period" id="insPeriodWrap" hidden>
        <div class="ins-period-seg" id="insPeriodSeg"></div>
        <label for="insPeriod" class="visually-hidden">Period</label>
        <select id="insPeriod" class="select ins-period-select"></select>
      </div>
    </header>
    <div class="ins-tabs-wrap no-print" id="insTabsWrap">
      <div class="ins-tabs" id="insTabs"></div>
    </div>
    <div id="insPanel" class="ins-panel" role="region" aria-label="Insights content" aria-live="polite">
      <div class="ins-loading" aria-busy="true">
        <div class="skeleton ins-skel-row"></div>
        <div class="skeleton ins-skel-chart"></div>
        <div class="skeleton ins-skel-row"></div>
      </div>
    </div>
  </main>
  <script src="js/vendor/papaparse.min.js"></script>
  <script src="js/vendor/chart.min.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/accounts.js"></script>
  <script src="js/lock.js"></script>
  <script src="js/undo.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/core.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/recurring.js"></script>
  <script src="js/transfers.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/columnMapping.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/getting-started.js"></script>
  <script src="js/tx-sheet.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/daterange.js"></script>
  <script src="js/comparison.js"></script>
  <script src="js/insights-ui.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
